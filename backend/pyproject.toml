[tool.poetry]
name = "trilingual-translator-backend"
version = "1.0.0"
description = "OpenAI-First trilingual translator backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
# Core framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

# OpenAI SDK (только это!)
openai = "^1.40.0"

# Security
pyjwt = "^2.8.0"
cryptography = "^43.0.0"

# Monitoring
prometheus-client = "^0.20.0"

# Redis (cache + rate limiting)
redis = {extras = ["hiredis"], version = "^5.0.0"}

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.27.0"

# Code quality
ruff = "^0.3.0"
black = "^24.0.0"
mypy = "^1.8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
