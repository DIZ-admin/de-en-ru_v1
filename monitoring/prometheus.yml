global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerting_rules.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8000

  - job_name: redis_exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis_exporter:9121
